spring:
  config:
    import: optional:configserver:http://localhost:8888

  application:
    name: movie-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

minio:
  url: http://localhost:9000
  access:
    key: admin
  secret:
    key: admin123
  bucket:
    name: cinema
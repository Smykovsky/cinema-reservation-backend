server:
  port: 8083

spring:
  application:
    name: cinema-service

springdoc:
  api-docs:
    path: /api/cinema/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    config:
      uri: http://localhost:8888
      fail-fast: true
      retry:
        maxAttempts: 3
        initialInterval: 1000
        multiplier: 1.2
        maxInterval: 2000

kafka:
  bootstrap-servers: localhost:9092
  consumer:
    group-id: cinema-service-group
    auto-offset-reset: earliest
    properties:
      spring.json.trusted.packages: "*, pl.smyk.common.dto"
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
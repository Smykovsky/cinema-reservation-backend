<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f5f5f5;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f5f5; padding: 20px;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">

                <!-- TYTUŁ -->
                <tr>
                    <td style="background-color: #007bff; padding: 30px; text-align: center;">
                        <h1 style="color: #ffffff; margin: 0; font-size: 24px;" th:text="${title}">Tytuł</h1>
                    </td>
                </tr>

                <!-- TREŚĆ -->
                <tr>
                    <td style="padding: 40px;">
                        <div th:utext="${description}" style="font-size: 16px; line-height: 1.6; color: #333;">
                            Opis
                        </div>
                    </td>
                </tr>

                <!-- STOPKA -->
                <tr>
                    <td style="background-color: #f8f9fa; padding: 20px; text-align: center;">
                        <p style="font-size: 12px; color: #999; margin: 0;">
                            © 2024 Twoja Firma
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
